name: Feature request
description: Propose a user outcome or supported engine integration
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What should an operator be able to accomplish, and in what situation?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current limitation
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Links and redacted screenshots are welcome; never include secrets or private terminal output.
